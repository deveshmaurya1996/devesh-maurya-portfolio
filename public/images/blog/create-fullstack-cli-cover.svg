<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Windows CMD window -->
  <rect width="1600" height="900" fill="#1a1a2e"/>
  <!-- Window chrome -->
  <rect x="120" y="90" width="1360" height="720" rx="8" fill="#0c0c0c" stroke="#3f3f46" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="120" y="90" width="1360" height="48" rx="8" fill="#1f1f1f"/>
  <rect x="120" y="122" width="1360" height="16" fill="#1f1f1f"/>
  <!-- Traffic / window controls (Windows style) -->
  <rect x="1380" y="104" width="28" height="20" rx="2" fill="#3f3f46"/>
  <rect x="1418" y="104" width="28" height="20" rx="2" fill="#3f3f46"/>
  <rect x="1456" y="104" width="28" height="20" rx="2" fill="#c42b1c"/>
  <!-- Title -->
  <text x="148" y="122" fill="#e4e4e7" font-family="Segoe UI, Consolas, monospace" font-size="18">Command Prompt</text>
  <!-- CMD body -->
  <text x="160" y="200" fill="#cccccc" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="28">Microsoft Windows [Version 10.0.26200.1]</text>
  <text x="160" y="244" fill="#cccccc" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="28">(c) Microsoft Corporation. All rights reserved.</text>
  <text x="160" y="320" fill="#cccccc" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="28">C:\Users\devesh\projects&gt; npx @dartix-software-solutions/create-fullstack-app@latest</text>
  <text x="160" y="390" fill="#3dd68c" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="26">? Project name: my-app</text>
  <text x="160" y="440" fill="#3dd68c" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="26">? Frontend: Next.js</text>
  <text x="160" y="490" fill="#3dd68c" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="26">? Backend: Express</text>
  <text x="160" y="540" fill="#3dd68c" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="26">? Database: PostgreSQL</text>
  <text x="160" y="590" fill="#3dd68c" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="26">? Auth: NextAuth</text>
  <text x="160" y="660" fill="#facc15" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="26">✔ Scaffold complete. cd my-app &amp;&amp; npm run dev</text>
  <text x="160" y="730" fill="#cccccc" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="28">C:\Users\devesh\projects\my-app&gt; <tspan fill="#ffffff">_</tspan></text>
